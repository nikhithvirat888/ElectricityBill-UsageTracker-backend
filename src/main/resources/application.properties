server.port=8080

# ---- Default: H2 file database (runs with zero setup) ----
spring.datasource.url=jdbc:h2:file:./data/electricitydb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# ---- To use MySQL: comment the H2 block above, uncomment below ----
#spring.datasource.url=jdbc:mysql://localhost:3306/electricitydb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.datasource.username=root
#spring.datasource.password=YOUR_PASSWORD

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Flat rate (Rs/unit) used by the Appliance Calculator
tariff.average-rate=6.0