server.port=${PORT:8080}

# Render: set DB_URL, DB_USERNAME, DB_PASSWORD and DB_DRIVER as environment variables.
# Laptop: nothing is set, so it falls back to a local H2 database automatically.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/electricitydb}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true

tariff.average-rate=6.0
